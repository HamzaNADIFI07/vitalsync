version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: vitalsync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - vitalsync_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vitalsync-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    networks:
      - vitalsync_net
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vitalsync-front
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - vitalsync_net
    depends_on:
      - backend

networks:
  vitalsync_net:
    driver: bridge

volumes:
  pg_data: